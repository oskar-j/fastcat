[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcat"
version = "0.2.0"
description = "Navigate Wikipedia categories quickly in a local redis instance"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-SA-3.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Ed Summers", email = "ehs@pobox.com" }]
maintainers = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
keywords = ["Wikipedia", "categories", "wiki-api", "knowledge engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "redis>=5.0.0,<8.0.0",
    "pycountry>=24.6.1,<26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/oskar-j/fastcat"
Repository = "https://github.com/oskar-j/fastcat"
Changelog = "https://github.com/oskar-j/fastcat/blob/master/CHANGELOG.md"
Issues = "https://github.com/oskar-j/fastcat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a reachable Redis server and downloads a SKOS dump from DBpedia",
]

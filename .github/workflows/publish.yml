name: publish

# Ships to PyPI on every merge into master. Uploads are idempotent: if the
# version in pyproject.toml is already on PyPI the run stops early instead of
# failing, so merges that do not bump the version are a no-op.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: check
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if curl -sfo /dev/null "https://pypi.org/pypi/fastcat/$version/json"; then
            echo "fastcat $version is already on PyPI - nothing to publish."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "fastcat $version is not on PyPI yet - will publish."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine '.[dev]'
      # Last line of defence: a direct push to master never went through the
      # pull request checks.
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastcat
    permissions:
      # Required for PyPI trusted publishing (OIDC); no API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag the release and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
